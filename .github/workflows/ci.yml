# Checks every push and pull request: types, tests, and that dist/ (what
# Overfin embeds) is exactly what the sources build; then the Go package
# that bundles it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # .npmrc turns install scripts off.
      - name: Install
        run: npm ci

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      - name: The built files match the sources
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "dist/ is out of date: run npm run build and commit it"; exit 1; }
          test -z "$(git status --porcelain -- dist)" || { git status -- dist; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
